name: Stáhnout mapové dlaždice

# Spouští se ručně z GitHub webu: záložka "Actions" → "Stáhnout mapové dlaždice" → "Run workflow".
# Nic se u tebe nemusí instalovat, vše běží na serverech GitHubu.
on:
  workflow_dispatch:
    inputs:
      bbox_south:
        description: 'Jižní hranice (lat)'
        default: '50.144'
      bbox_north:
        description: 'Severní hranice (lat)'
        default: '50.162'
      bbox_west:
        description: 'Západní hranice (lon)'
        default: '14.351'
      bbox_east:
        description: 'Východní hranice (lon)'
        default: '14.401'
      zoom_min:
        description: 'Minimální zoom'
        default: '12'
      zoom_max:
        description: 'Maximální zoom'
        default: '17'

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stáhnout dlaždice
        env:
          BBOX_SOUTH: ${{ inputs.bbox_south }}
          BBOX_NORTH: ${{ inputs.bbox_north }}
          BBOX_WEST: ${{ inputs.bbox_west }}
          BBOX_EAST: ${{ inputs.bbox_east }}
          ZOOM_MIN: ${{ inputs.zoom_min }}
          ZOOM_MAX: ${{ inputs.zoom_max }}
        run: python download_tiles.py

      - name: Uložit dlaždice do repozitáře
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tiles/
          git diff --staged --quiet || git commit -m "Přidat mapové dlaždice"
          git pull --rebase origin ${{ github.ref_name }}
          git push
