<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Offline turistická mapa</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg: #14171a;
    --panel: #1c2024;
    --panel-border: #2a2f34;
    --text: #e8eaed;
    --text-dim: #9aa1a8;
    --accent: #4fc3a1;
    --accent-dim: #2f6e5c;
    --red: #d9534f;
    --blue: #4a7fd9;
    --yellow: #d9b34a;
    --mono: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;
  }
  @font-face{
    font-family:'IBM Plex Mono';
    src: local('IBM Plex Mono');
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; margin:0; background:var(--bg); color:var(--text); font-family: var(--mono); overscroll-behavior: none; }
  #map{ position:absolute; inset:0; background:#0d0f11; }

  .leaflet-control-attribution{ background: rgba(20,23,26,0.7) !important; color: var(--text-dim) !important; font-size:10px; }
  .leaflet-control-attribution a{ color: var(--text-dim) !important; }
  .leaflet-control-zoom a{ background:var(--panel) !important; color:var(--text) !important; border-color:var(--panel-border) !important; }

  #topbar{
    position:absolute; top:0; left:0; right:0; z-index:1000;
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 12px; pointer-events:none;
  }
  #title{
    pointer-events:auto;
    background:var(--panel); border:1px solid var(--panel-border);
    padding:6px 10px; border-radius:8px; font-size:12px; color:var(--text-dim);
    letter-spacing:0.02em;
  }
  #status{
    pointer-events:auto;
    background:var(--panel); border:1px solid var(--panel-border);
    padding:6px 10px; border-radius:8px; font-size:11px; display:flex; align-items:center; gap:6px;
  }
  #status .dot{ width:7px; height:7px; border-radius:50%; background:var(--text-dim); }
  #status.online .dot{ background: var(--accent); box-shadow:0 0 6px var(--accent); }
  #status.offline .dot{ background: var(--red); }

  #panel{
    position:absolute; left:12px; right:12px; bottom:12px; z-index:1000;
    background:var(--panel); border:1px solid var(--panel-border);
    border-radius:12px; padding:12px 14px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .stat{ display:flex; flex-direction:column; gap:2px; }
  .stat .label{ font-size:9px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; }
  .stat .value{ font-size:15px; color:var(--text); font-variant-numeric: tabular-nums; }
  .stat .value.accent{ color:var(--accent); }
  .stat .value-sub{ font-size:10px; color:var(--text-dim); margin-top:1px; }

  #profileDrawer{
    position:absolute; left:12px; right:12px; bottom:96px; z-index:999;
    background:var(--panel); border:1px solid var(--panel-border);
    border-radius:12px; padding:8px 10px;
    display:none; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  #profileDrawer.show{ display:block; }
  #profileDrawer svg{ display:block; width:100%; height:70px; }

  #btns{ display:flex; gap:8px; }
  .btn{
    background:var(--accent-dim); color:#dff5ec; border:1px solid var(--accent);
    border-radius:8px; padding:10px 12px; font-family:var(--mono); font-size:12px;
    display:flex; align-items:center; justify-content:center;
    min-width:44px; min-height:44px;
  }
  .btn:active{ background:var(--accent); }
  .btn.secondary{ background:var(--panel); border-color:var(--panel-border); color:var(--text-dim); }

  #loadgpx{ display:none; }

  .marker-me{
    width:16px; height:16px; border-radius:50%;
    background: var(--blue); border: 2px solid #fff;
    box-shadow: 0 0 0 4px rgba(74,127,217,0.25);
  }
  .marker-end{
    width:12px; height:12px; border-radius:2px;
    display:flex; align-items:center; justify-content:center;
    font-size:9px; font-weight:bold; color:#fff;
  }

  #toast{
    position:absolute; top:110px; left:50%; transform:translateX(-50%);
    background:var(--panel); border:1px solid var(--panel-border); color:var(--text);
    padding:8px 14px; border-radius:8px; font-size:11px; z-index:2000;
    opacity:0; transition:opacity 0.3s; pointer-events:none; text-align:center; max-width:80%;
  }
  #toast.show{ opacity:1; }

  #onlinePrompt{
    display:none;
    position:absolute; top:56px; left:12px; right:12px; z-index:2000;
    background:var(--panel); border:1px solid var(--panel-border);
    border-radius:10px; padding:10px 12px;
    align-items:center; justify-content:space-between; gap:10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  #onlinePromptText{ font-size:11px; color:var(--text); flex:1; }
  #onlinePromptBtns{ display:flex; gap:6px; }
  #onlinePromptBtns .btn{ padding:8px 10px; min-width:auto; min-height:auto; font-size:11px; }

  #settingsOverlay{
    position:fixed; inset:0; z-index:3000;
    background:rgba(10,12,14,0.92);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  #settingsOverlay.hidden{ display:none; }
  #settingsCard{
    background:var(--panel); border:1px solid var(--panel-border);
    border-radius:14px; padding:20px; max-width:340px; width:100%;
  }
  #settingsCard h2{ font-size:14px; margin:0 0 4px; color:var(--text); font-weight:normal; }
  #settingsCard .sub{ font-size:11px; color:var(--text-dim); margin-bottom:16px; }
  .setting-row{
    display:flex; align-items:center; gap:10px;
    padding:10px 0; border-top:1px solid var(--panel-border);
  }
  .setting-row:first-of-type{ border-top:none; }
  .setting-row input[type="checkbox"]{
    width:18px; height:18px; accent-color: var(--accent); flex-shrink:0;
  }
  .setting-row label{ font-size:12px; color:var(--text); flex:1; }
  .setting-row .desc{ font-size:10px; color:var(--text-dim); display:block; margin-top:2px; }
  #settingsStart{
    margin-top:16px; text-align:center; padding:12px; font-size:13px;
  }
</style>
</head>
<body>

<div id="settingsOverlay">
  <div id="settingsCard">
    <h2>Než vyrazíš</h2>
    <div class="sub">Zapni si, co chceš mít v terénu aktivní.</div>
    <div class="setting-row">
      <input type="checkbox" id="setOffRoute" checked>
      <label for="setOffRoute">Upozornit při odchýlení od trasy
        <span class="desc">zvuk + banner, když jsi &gt;50 m od trasy</span>
      </label>
    </div>
    <div class="setting-row">
      <input type="checkbox" id="setEta" checked>
      <label for="setEta">Odhad času do cíle
        <span class="desc">počítá se z tvého tempa</span>
      </label>
    </div>
    <div class="setting-row">
      <input type="checkbox" id="setProfile" checked>
      <label for="setProfile">Výškový profil
        <span class="desc">tlačítko ⛰ s grafem trasy</span>
      </label>
    </div>
    <div class="btn" id="settingsStart">Jedeme</div>
  </div>
</div>

<div id="map"></div>

<div id="topbar">
  <div id="title">Trasa</div>
  <div id="status" class="online"><div class="dot"></div><span id="statusText">online</span></div>
</div>

<div id="toast"></div>

<div id="onlinePrompt">
  <div id="onlinePromptText">Část mapy chybí lokálně. Stáhnout ji online?</div>
  <div id="onlinePromptBtns">
    <div class="btn" id="onlineYes">Ano</div>
    <div class="btn secondary" id="onlineNo">Ne</div>
  </div>
</div>

<div id="profileDrawer"></div>

<div id="panel">
  <div class="stat">
    <div class="label">Trasa</div>
    <div class="value" id="statRoute">4.3 km</div>
  </div>
  <div class="stat">
    <div class="label">K cíli</div>
    <div class="value accent" id="statToEnd">–</div>
    <div class="value-sub" id="statEta">–</div>
  </div>
  <div class="stat">
    <div class="label">Nadm. výška</div>
    <div class="value" id="statEle">–</div>
  </div>
  <div id="btns">
    <label class="btn secondary" for="loadgpx">GPX</label>
    <input type="file" id="loadgpx" accept=".gpx" />
    <div class="btn secondary" id="profileBtn">⛰</div>
    <div class="btn" id="locateBtn">◎</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ---- Toast (definováno hned na začátku, ať funguje i při chybě úplně na startu) ----
var toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// Pokud kdekoli ve skriptu nastane chyba, ukaž ji viditelně dole —
// na mobilu bez připojeného Macu jinak nejde chybu v konzoli vidět.
window.addEventListener('error', (e) => {
  showToast('Chyba ve skriptu: ' + e.message + ' (řádek ' + e.lineno + ')');
});

function haversine(a, b){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(b[0]-a[0]);
  const dLon = toRad(b[1]-a[1]);
  const lat1 = toRad(a[0]);
  const lat2 = toRad(b[0]);
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function routeLength(points){
  let d = 0;
  for(let i=1;i<points.length;i++) d += haversine(points[i-1], points[i]);
  return d;
}

// ---- Geometrie trasy: pro odhad odchylky od trasy, ETA a výškový profil ----
// Body trasy si předpočítáme do lokálních metrů (jednoduchá rovinná projekce —
// pro trasu v řádu kilometrů je zakřivení Země zanedbatelné), ať nemusíme
// při každé aktualizaci polohy počítat s trigonometrií dokola.
let routeXY = [];
let routeCumDist = [];

function computeRouteGeometry(points){
  const refLat = points[0][0];
  const refLon = points[0][1];
  const R = 6371000;
  routeXY = points.map(p => ({
    x: (p[1]-refLon) * Math.PI/180 * R * Math.cos(refLat*Math.PI/180),
    y: (p[0]-refLat) * Math.PI/180 * R
  }));
  routeCumDist = [0];
  for(let i=1;i<points.length;i++){
    routeCumDist.push(routeCumDist[i-1] + haversine([points[i-1][0],points[i-1][1]], [points[i][0],points[i][1]]));
  }
}

// Najde nejbližší bod na trase (na kterékoli úsečce, ne jen na vrcholu) k dané poloze.
// Vrací vzdálenost od trasy v metrech a kumulativní vzdálenost od startu k tomu bodu.
function nearestOnRoute(lat, lon){
  if(routePoints.length < 2 || routeXY.length < 2) return null;
  const refLat = routePoints[0][0];
  const refLon = routePoints[0][1];
  const R = 6371000;
  const px = (lon-refLon) * Math.PI/180 * R * Math.cos(refLat*Math.PI/180);
  const py = (lat-refLat) * Math.PI/180 * R;
  let best = null;
  for(let i=1;i<routeXY.length;i++){
    const a = routeXY[i-1], b = routeXY[i];
    const dx = b.x-a.x, dy = b.y-a.y;
    const len2 = dx*dx+dy*dy;
    let t = len2 === 0 ? 0 : ((px-a.x)*dx + (py-a.y)*dy)/len2;
    t = Math.max(0, Math.min(1, t));
    const cx = a.x + t*dx, cy = a.y + t*dy;
    const dist = Math.hypot(px-cx, py-cy);
    if(!best || dist < best.dist){
      const segLen = Math.sqrt(len2);
      best = { dist, cum: routeCumDist[i-1] + t*segLen };
    }
  }
  return best;
}

function eleGainLoss(points){
  let gain = 0, loss = 0;
  for(let i=1;i<points.length;i++){
    const diff = (points[i][2]||0) - (points[i-1][2]||0);
    if(diff > 0) gain += diff; else loss += -diff;
  }
  return {gain, loss};
}

function loadRoute(points){
  if(routeLine) map.removeLayer(routeLine);
  if(routeHalo) map.removeLayer(routeHalo);
  if(startMarker) map.removeLayer(startMarker);
  if(endMarker) map.removeLayer(endMarker);

  routePoints = points;
  const latlngs = points.map(p => [p[0], p[1]]);
  // Bílý "halo" pod barevnou čárou — trasa díky tomu vynikne na jakémkoli
  // podkladu (zeleném lese, modré vodě...) a nesplývá s červenou/žlutou
  // turistickou značkou na mapě.
  routeHalo = L.polyline(latlngs, { color: '#ffffff', weight: 7, opacity: 0.9 }).addTo(map);
  routeLine = L.polyline(latlngs, { color: '#c026d3', weight: 4, opacity: 0.95 }).addTo(map);

  startMarker = L.marker(latlngs[0], {
    icon: L.divIcon({ className:'', html:'<div class="marker-end" style="background:var(--accent)">A</div>', iconSize:[12,12] })
  }).addTo(map);
  endMarker = L.marker(latlngs[latlngs.length-1], {
    icon: L.divIcon({ className:'', html:'<div class="marker-end" style="background:var(--red)">B</div>', iconSize:[12,12] })
  }).addTo(map);

  map.fitBounds(routeLine.getBounds(), { padding: [30, 90] });

  const km = (routeLength(points)/1000).toFixed(1);
  document.getElementById('statRoute').textContent = km + ' km';
  document.getElementById('title').textContent = km.replace('.', ',') + ' km';

  const {gain} = eleGainLoss(points);
  const eleMin = Math.min(...points.map(p=>p[2]||0));
  const eleMax = Math.max(...points.map(p=>p[2]||0));
  document.getElementById('statEle').textContent = `${Math.round(eleMin)}–${Math.round(eleMax)} m`;

  computeRouteGeometry(points);
  renderElevationProfile(points);
  paceHistory = [];

  updateDistanceToEnd();
}

// ---- Výškový profil ----
// Vykreslí se jednou při načtení trasy do skryté zásuvky (#profileDrawer),
// zobrazí se po klepnutí na tlačítko ⛰. Svislá čárka ukazuje, kde na profilu
// právě jsi (podle nejbližšího bodu na trase k tvé GPS poloze).
const PROFILE_W = 600, PROFILE_H = 70, PROFILE_PAD = 4;

function renderElevationProfile(points){
  const total = routeCumDist[routeCumDist.length-1] || 1;
  const eles = points.map(p => p[2]||0);
  const eleMin = Math.min(...eles), eleMax = Math.max(...eles);
  const eleRange = Math.max(1, eleMax - eleMin);

  const xAt = (cum) => PROFILE_PAD + (cum/total) * (PROFILE_W - 2*PROFILE_PAD);
  const yAt = (ele) => PROFILE_H - PROFILE_PAD - ((ele-eleMin)/eleRange) * (PROFILE_H - 2*PROFILE_PAD);

  const linePts = points.map((p,i) => `${xAt(routeCumDist[i]).toFixed(1)},${yAt(p[2]||0).toFixed(1)}`).join(' ');
  const areaPts = `${PROFILE_PAD},${PROFILE_H-PROFILE_PAD} ${linePts} ${PROFILE_W-PROFILE_PAD},${PROFILE_H-PROFILE_PAD}`;

  document.getElementById('profileDrawer').innerHTML = `
    <svg viewBox="0 0 ${PROFILE_W} ${PROFILE_H}" preserveAspectRatio="none">
      <polygon points="${areaPts}" fill="#4fc3a1" opacity="0.15"></polygon>
      <polyline points="${linePts}" fill="none" stroke="#4fc3a1" stroke-width="2"></polyline>
      <line id="profileMarker" x1="${PROFILE_PAD}" y1="0" x2="${PROFILE_PAD}" y2="${PROFILE_H}" stroke="#4a7fd9" stroke-width="2" stroke-dasharray="3,3"></line>
    </svg>`;
}

function updateProfileMarker(cumNow){
  const total = routeCumDist[routeCumDist.length-1] || 1;
  const x = (PROFILE_PAD + (cumNow/total) * (PROFILE_W - 2*PROFILE_PAD)).toFixed(1);
  const marker = document.getElementById('profileMarker');
  if(marker){ marker.setAttribute('x1', x); marker.setAttribute('x2', x); }
}

document.getElementById('profileBtn').addEventListener('click', () => {
  document.getElementById('profileDrawer').classList.toggle('show');
});

document.getElementById('profileBtn').style.display = featureProfile ? '' : 'none';
if(!featureEta) document.getElementById('statEta').textContent = '';

loadRoute(DEFAULT_ROUTE);

// ---- Nahrání vlastní GPX ----
document.getElementById('loadgpx').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const xml = new DOMParser().parseFromString(reader.result, 'application/xml');
      const trkpts = [...xml.getElementsByTagName('trkpt')];
      if(trkpts.length === 0){ showToast('V GPX nebyly nalezeny žádné body'); return; }
      const points = trkpts.map(pt => {
        const lat = parseFloat(pt.getAttribute('lat'));
        const lon = parseFloat(pt.getAttribute('lon'));
        const eleTag = pt.getElementsByTagName('ele')[0];
        const ele = eleTag ? parseFloat(eleTag.textContent) : 0;
        return [lat, lon, ele];
      });
      loadRoute(points);
      showToast('Trasa nahrána (' + points.length + ' bodů)');
    }catch(err){
      showToast('Nepodařilo se přečíst GPX soubor');
    }
  };
  reader.readAsText(file);
});

// ---- Poloha ----

function updateDistanceToEnd(){
  // Záložní vzdušná čára — použije se jen než je spočtená geometrie trasy.
  if(!meMarker || routePoints.length === 0) return;
  const me = meMarker.getLatLng();
  const end = routePoints[routePoints.length-1];
  const d = haversine([me.lat, me.lng], end);
  document.getElementById('statToEnd').textContent = d > 950 ? (d/1000).toFixed(1)+' km' : Math.round(d)+' m';
}

// Vzdálenost k cíli počítaná podél trasy (ne vzdušnou čarou) — bere kumulativní
// vzdálenost k nejbližšímu bodu na trase a odečte ji od celkové délky.
function updateDistanceAlongRoute(cumNow){
  const total = routeCumDist[routeCumDist.length-1] || 0;
  const remaining = Math.max(0, total - cumNow);
  document.getElementById('statToEnd').textContent = remaining > 950 ? (remaining/1000).toFixed(1)+' km' : Math.round(remaining)+' m';
}

function onPosition(pos){
  const {latitude, longitude, accuracy} = pos.coords;
  const latlng = [latitude, longitude];
  if(!meMarker){
    meMarker = L.marker(latlng, {
      icon: L.divIcon({ className:'', html:'<div class="marker-me"></div>', iconSize:[16,16] })
    }).addTo(map);
    accuracyCircle = L.circle(latlng, { radius: accuracy, color:'#4a7fd9', weight:1, fillOpacity:0.1 }).addTo(map);
  } else {
    meMarker.setLatLng(latlng);
    accuracyCircle.setLatLng(latlng);
    accuracyCircle.setRadius(accuracy);
  }

  const nearest = nearestOnRoute(latitude, longitude);
  if(nearest){
    updateDistanceAlongRoute(nearest.cum);
    if(featureProfile) updateProfileMarker(nearest.cum);
    if(featureOffRoute) checkOffRoute(nearest.dist);
    if(featureEta) updateEta(nearest.cum);
  } else {
    updateDistanceToEnd();
  }
}

// Upozornění, když se vzdálíš od trasy — vizuální banner + zvukový signál.
// (Vibrace přes navigator.vibrate na iOS Safari nefunguje, proto primárně zvuk.)
const OFF_ROUTE_THRESHOLD = 50; // metrů
const OFF_ROUTE_COOLDOWN = 60000; // needráždit častěji než jednou za minutu

function checkOffRoute(distFromRoute){
  if(distFromRoute > OFF_ROUTE_THRESHOLD){
    const now = Date.now();
    if(!wasOffRoute || now - lastOffRouteWarnTime > OFF_ROUTE_COOLDOWN){
      showToast('Jsi ' + Math.round(distFromRoute) + ' m od trasy');
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
      playBeep();
      lastOffRouteWarnTime = now;
    }
    wasOffRoute = true;
  } else {
    wasOffRoute = false;
  }
}

function playBeep(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = 880;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.25);
  }catch(e){}
}

// Odhad zbývajícího času — z tempa za posledních ~3 minut chůze podél trasy.
function updateEta(cumNow){
  const total = routeCumDist[routeCumDist.length-1] || 0;
  const remaining = Math.max(0, total - cumNow);
  paceHistory.push({ t: Date.now(), cum: cumNow });
  const cutoff = Date.now() - 180000;
  paceHistory = paceHistory.filter(p => p.t > cutoff);

  const etaEl = document.getElementById('statEta');
  if(paceHistory.length < 2){ etaEl.textContent = '–'; return; }

  const first = paceHistory[0];
  const last = paceHistory[paceHistory.length-1];
  const dt = (last.t - first.t) / 1000;
  const dCum = last.cum - first.cum;

  if(dt < 15 || dCum <= 0){ etaEl.textContent = '…'; return; }

  const paceMs = dCum / dt;
  const etaMin = Math.round(remaining / paceMs / 60);
  etaEl.textContent = etaMin < 60 ? '~' + etaMin + ' min' : '~' + (etaMin/60).toFixed(1) + ' h';
}

function onPositionError(err){
  showToast('Polohu se nepodařilo získat (' + err.message + ')');
}

document.getElementById('locateBtn').addEventListener('click', () => {
  if(!navigator.geolocation){ showToast('Prohlížeč nepodporuje geolokaci'); return; }
  // AudioContext se musí vytvořit v reakci na gesto uživatele (klik) —
  // jinak by ho Safari později odmítl přehrát zvuk z asynchronního GPS callbacku.
  audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
  if(watchId === null){
    watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, {
      enableHighAccuracy: true, maximumAge: 5000, timeout: 15000
    });
    showToast('Sledování polohy zapnuto');
  }
  if(meMarker) map.setView(meMarker.getLatLng(), 16);
});

// ---- Online/offline indikátor ----
function updateStatus(){
  const el = document.getElementById('status');
  const online = navigator.onLine;
  el.className = online ? 'online' : 'offline';
  document.getElementById('statusText').textContent = online ? 'online' : 'offline';
}
window.addEventListener('online', updateStatus);
window.addEventListener('offline', updateStatus);
updateStatus();

// ---- Service worker (offline cache stránky + dlaždic) ----
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
